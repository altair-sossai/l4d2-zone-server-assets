trigger:
  - main

pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  sshServiceConnection: "L4D2 - Server"
  remoteTempFolder: "/home/devops/zone-server-assets"
  gameFolder: "/home/steam/l4d2/left4dead2"

stages:
  - stage: Deploy
    jobs:
      - job: CompressAndUpload
        steps:
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/packages
              tar -czf $(Build.ArtifactStagingDirectory)/packages/models.tar.gz -C $(Build.Repository.LocalPath)/models .
              tar -czf $(Build.ArtifactStagingDirectory)/packages/materials.tar.gz -C $(Build.Repository.LocalPath)/materials .
            displayName: "📦 Compress models and materials into .tar.gz files"

          - task: SSH@0
            displayName: "🧹 Prepare remote temp folder"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              readyTimeout: "20000"
              commands: |
                mkdir -p $(remoteTempFolder)
                rm -f $(remoteTempFolder)/*.tar.gz

          - task: CopyFilesOverSSH@0
            displayName: "📤 Upload compressed files to server"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              sourceFolder: "$(Build.ArtifactStagingDirectory)/packages"
              contents: "*.tar.gz"
              targetFolder: "$(remoteTempFolder)"
              cleanTargetFolder: false
              overwrite: true
              readyTimeout: "20000"

          - task: SSH@0
            displayName: "🛠️ Extract models and materials on server"
            inputs:
              sshEndpoint: $(sshServiceConnection)
              readyTimeout: "20000"
              commands: |
                mkdir -p $(gameFolder)/models $(gameFolder)/materials
                tar -xzf $(remoteTempFolder)/models.tar.gz -C $(gameFolder)/models
                tar -xzf $(remoteTempFolder)/materials.tar.gz -C $(gameFolder)/materials
                rm -f $(remoteTempFolder)/*.tar.gz

          - task: AzureCLI@2
            displayName: "☁️ Upload game assets to Azure Blob Storage"
            inputs:
              azureSubscription: "PessoalSubscription"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az storage blob upload-batch \
                  --account-name l4d2playstats \
                  --destination assets \
                  --source "$(Build.Repository.LocalPath)/assets" \
                  --pattern "*" \
                  --overwrite

          - task: AzureCLI@2
            displayName: "⚡ Upload FastDL files to Azure Blob Storage"
            inputs:
              azureSubscription: "PessoalSubscription"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                az storage blob upload-batch \
                  --account-name l4d2playstats \
                  --destination fastdl \
                  --source "$(Build.Repository.LocalPath)/fastdl" \
                  --pattern "*" \
                  --overwrite
                az storage blob upload-batch \
                  --account-name l4d2playstats \
                  --destination fastdl \
                  --destination-path models \
                  --source "$(Build.Repository.LocalPath)/models" \
                  --pattern "*" \
                  --overwrite
                az storage blob upload-batch \
                  --account-name l4d2playstats \
                  --destination fastdl \
                  --destination-path materials \
                  --source "$(Build.Repository.LocalPath)/materials" \
                  --pattern "*" \
                  --overwrite
